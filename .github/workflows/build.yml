
name: Compile C++ to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Install Compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile C++
        shell: msys2 {0}
        run: |
          source_file=$(find . -type f -name '*.cpp' -not -path './.git/*' | head -n 1)

          if [ -z "$source_file" ]; then
            echo "File CPP tidak ditemukan!"
            exit 1
          fi

          echo "Mengompilasi: $source_file"

          g++ "$source_file" -o program.exe -static -static-libgcc -static-libstdc++

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Program-EXE
          path: program.exe
